name: Build Tree Tally app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the app
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TreeTally-app
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Name the app file
        run: cp app/build/outputs/apk/debug/app-debug.apk TreeTally.apk
      - name: Publish on the Releases page
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tree Tally (latest)
          body: Download TreeTally.apk below and open it on the phone to install.
          files: TreeTally.apk
          make_latest: true
